name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · lint · typecheck · test · build
    runs-on: ubuntu-latest
    # The two browser suites run in their own jobs below, in parallel with this one. One job running
    # everything outgrew its cap twice — 20 minutes in round 3 (D-038), then 30 once rounds 4 and 5
    # grew both Playwright suites (PRs #32 and #33 were cut off mid-e2e with every test passing) —
    # so the work is split rather than the line moved again (D243). Each job has its own cap.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # pnpm comes from the `packageManager` field in the root package.json.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # No env vars are set for any step after this one: `pnpm test` must pass without any
      # (CLAUDE.md §2, §7). A test that needs a key is a defect, not a CI setting.
      # The install alone skips Electron's ~100 MB binary (D292): no CI job launches the desktop
      # shell yet, and `electron` still installs its types for apps/desktop's typecheck.
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage thresholds
        run: pnpm -r --if-present test:coverage

      # `apps/web`'s `vite build` bundles Monaco since Forge (D299) and peaks near 2.5 GB of heap,
      # past Node's default limit on this runner (~2 GB). It then passed or died by luck: on 1b87e74
      # two of the three Build steps passed and acceptance's ran out of memory (D-094). Every Build
      # step gets the same headroom.
      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Required, never `continue-on-error`; skipped with a message only while the owning package is absent.
  e2e:
    name: end-to-end (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # Both suites run against built packages, as they did when they followed `verify`'s Build.
      # NODE_OPTIONS: see `verify`'s Build (D-094).
      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: End-to-end (apps/web)
        run: |
          if [ -d apps/web/e2e ]; then
            pnpm test:e2e
          else
            echo "SKIPPED: apps/web/e2e does not exist yet (Mouli creates it in round 1, feature M1)."
          fi

      # The Playwright config keeps a trace and the page's aria snapshot (error-context.md) for a
      # failed test, but they live on the runner and die with it. A test that fails only here, never on
      # a Windows box, cannot be diagnosed without them (PR #30, TC-CHAT-003).
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-e2e
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  acceptance:
    name: acceptance (real engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # Both suites run against built packages, as they did when they followed `verify`'s Build.
      # NODE_OPTIONS: see `verify`'s Build (D-094).
      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The acceptance Playwright pass needs a browser. In the single job it borrowed the one the e2e
      # step installed (`apps/web` `test:e2e` runs `playwright install chromium`); on its own it must
      # install it, or every browser test fails at launch (first run of D243).
      - name: Install Playwright browser
        run: pnpm --filter @ace/web exec playwright install chromium

      - name: Acceptance (real engine)
        run: |
          if [ -f tests/acceptance/vitest.config.ts ]; then
            pnpm test:acceptance
          else
            echo "SKIPPED: tests/acceptance/vitest.config.ts does not exist yet (Arhant creates it in round 1, feature A1)."
          fi
        # The Playwright pass builds apps/web itself (its web server); see `verify`'s Build (D-094).
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-acceptance
          path: |
            tests/acceptance/test-results
            tests/acceptance/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  ownership:
    name: ownership map
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Scripts run under cmd on a developer's Windows box and under sh on this runner. A
      # backtick is inert in one and command substitution in the other, so a harmless-looking
      # message can silently execute whatever it names. That cost a CI run once; never again.
      - name: Refuse shell metacharacters in package scripts
        run: |
          node -e '
            const { readFileSync, readdirSync, existsSync } = require("node:fs");
            const manifests = ["package.json"];
            for (const dir of ["packages", "apps", "tests"]) {
              if (!existsSync(dir)) continue;
              for (const entry of readdirSync(dir)) {
                const file = dir + "/" + entry + "/package.json";
                if (existsSync(file)) manifests.push(file);
              }
            }
            const BACKTICK = "`";
            let failed = false;
            for (const file of manifests) {
              const scripts = JSON.parse(readFileSync(file, "utf8")).scripts || {};
              for (const name of Object.keys(scripts)) {
                if (String(scripts[name]).includes(BACKTICK)) {
                  console.log("::error file=" + file + "::script \"" + name + "\" contains a backtick, which is command substitution on POSIX");
                  failed = true;
                }
              }
            }
            console.log("checked " + manifests.length + " manifests");
            process.exit(failed ? 1 : 0);
          '

      # CLAUDE.md §4 reserves these paths for later rounds. A new folder outside the
      # ownership map is drift and should be reverted, not merged. `apps/desktop` left the list
      # when the desktop shell was built (D292).
      - name: Refuse folders reserved for later rounds
        run: |
          reserved="apps/cli apps/site packages/storage-cloud services/training bench"
          failed=0
          for path in $reserved; do
            if [ -e "$path" ]; then
              echo "::error::$path is reserved for a later round (CLAUDE.md §4)."
              failed=1
            fi
          done
          exit $failed
